# ── Prod ──────────────────────────────────────────────────────────────────────
Maintenance_ON:
  extends: .drill_git_setup
  stage: Maintenance_Page
  when: manual
  variables:
    GIT_STRATEGY:        none
    ENV_LIST:            "prod-dc prod-dr"
    REPLICA_COUNT:       "1"
    MAINTENANCE_ENABLED: "true"
  rules:
    - if: '$DRILL_TIER == "prod"'
  script: *maintenance_script

Maintenance_OFF:
  extends: .drill_git_setup
  stage: Maintenance_Page
  when: manual
  variables:
    GIT_STRATEGY:        none
    ENV_LIST:            "prod-dc prod-dr"
    REPLICA_COUNT:       "0"
    MAINTENANCE_ENABLED: "false"
  rules:
    - if: '$DRILL_TIER == "prod"'
  script: *maintenance_script

# ── Preprod ───────────────────────────────────────────────────────────────────
PreProd_Maintenance_ON:
  extends: .drill_git_setup
  stage: Maintenance_Page
  when: manual
  variables:
    GIT_STRATEGY:        none
    ENV_LIST:            "pre-prod-dc pre-prod"
    REPLICA_COUNT:       "1"
    MAINTENANCE_ENABLED: "true"
  rules:
    - if: '$DRILL_TIER == "preprod"'
  script: *maintenance_script

PreProd_Maintenance_OFF:
  extends: .drill_git_setup
  stage: Maintenance_Page
  when: manual
  variables:
    GIT_STRATEGY:        none
    ENV_LIST:            "pre-prod-dc pre-prod"
    REPLICA_COUNT:       "0"
    MAINTENANCE_ENABLED: "false"
  rules:
    - if: '$DRILL_TIER == "preprod"'
  script: *maintenance_script

# Nonprod: no maintenance page — stage intentionally empty for nonprod tier
